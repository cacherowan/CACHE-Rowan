<svg width="680" height="640" viewBox="0 0 680 640" xmlns="http://www.w3.org/2000/svg">
  <title>Molecular property retrieval workflow</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Box 1: Setup (gray) -->
  <rect x="140" y="40" width="400" height="88" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>

<!-- Box Title-->

  <text x="340" y="80" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">Setup</text>

<!-- Box Text -->

  <text x="340" y="102" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444441">
    <tspan x="340" dy="0">Import packages / libraries</tspan>
  </text>
  <line x1="340" y1="128" x2="340" y2="158" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Box 2: Load weight (teal) -->
  <rect x="140" y="158" width="400" height="88" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>

<!-- Box Title-->

  <text x="340" y="198" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#04342C">Load Potential</text>

<!-- Box Text -->

  <text x="340" y="220" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">Load MACE-OFF (Machine Learning Potential)</text>
  <line x1="340" y1="246" x2="340" y2="276" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Box 3: Chemical input (teal) -->
  <rect x="140" y="276" width="400" height="88" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>

<!-- Box Title-->

  <text text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#04342C">
    <tspan x="340" y="300">Input SMILES identification and use</tspan>
    <tspan x="340" y="315">IdealGasThermo to compute properties</tspan>
  </text>

<!-- Box Text -->

  <text text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">
    <tspan x="340" y="334">Minimize / optimize molecule, simulate</tspan>
    <tspan x="340" y="348">molecule, and obtain chemical properties</tspan>
  </text>
  <line x1="340" y1="364" x2="340" y2="394" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Box 4: Run ANN model (coral) -->
  <rect x="140" y="394" width="400" height="88" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>

<!-- Box Title-->

  <text x="340" y="420" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#4A1B0C">Repeat step 3 but building molecule</text>

<!-- Box Text -->

  <text text-anchor="middle" font-family="sans-serif" font-size="12" fill="#712B13">
    <tspan x="340" y="444">Repeat step 3, but without g2 name (must build</tspan>
    <tspan x="340" y="458">molecule from scratch)</tspan>
  </text>
  <line x1="340" y1="482" x2="340" y2="512" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Box 5: Print impacts (coral) -->
  <rect x="140" y="512" width="400" height="88" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>

<!-- Box Title-->

  <text x="340" y="552" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#4A1B0C">Display results</text>

<!-- Box Text -->

  <text x="340" y="574" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#712B13">Display comparison results using pandas</text>

</svg>
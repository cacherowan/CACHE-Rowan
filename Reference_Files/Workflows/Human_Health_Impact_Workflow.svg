<svg width="680" height="630" viewBox="0 0 680 630" xmlns="http://www.w3.org/2000/svg">
  <title>Molecular property retrieval workflow</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Box 1: Setup (gray) -->
  <rect x="140" y="40" width="400" height="70" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>

<!-- Box Title-->

  <text x="340" y="58" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">Setup</text>

<!-- Box Text -->

  <text x="340" y="78" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444441">
    <tspan x="340" dy="0">Import packages / libraries, download model</tspan>
    <tspan x="340" dy="14">weight and create paths (model weight and database)</tspan>
  </text>
  <line x1="340" y1="110" x2="340" y2="150" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Box 2: Load weight (teal) -->
  <rect x="140" y="150" width="400" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>

<!-- Box Title-->

  <text x="340" y="168" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#04342C">Load Weight For Model</text>

<!-- Box Text -->

  <text x="340" y="186" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">Prepares model to be used</text>
  <line x1="340" y1="206" x2="340" y2="246" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Box 3: Chemical input (teal) -->
  <rect x="140" y="246" width="400" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>

<!-- Box Title-->

  <text x="340" y="264" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#04342C">Chemical Input</text>

<!-- Box Text -->

  <text x="340" y="282" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">Chemical specified by SMILES string</text>
  <line x1="340" y1="302" x2="340" y2="342" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Box 4: Run ANN model (coral) -->
  <rect x="140" y="342" width="400" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>

<!-- Box Title-->

  <text x="340" y="360" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#4A1B0C">Run ANN Model</text>

<!-- Box Text -->

  <text x="340" y="378" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#712B13">ANN model is used to get impact data</text>
  <line x1="340" y1="398" x2="340" y2="438" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Box 5: Print impacts (coral) -->
  <rect x="140" y="438" width="400" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>

<!-- Box Title-->

  <text x="340" y="456" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#4A1B0C">Print impacts</text>

<!-- Box Text -->

  <text x="340" y="474" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#712B13">Human health values are displayed</text>
  <line x1="340" y1="494" x2="340" y2="534" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Box 6: Interactive slider (purple) -->
  <rect x="140" y="534" width="400" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>

<!-- Box Title-->

  <text x="340" y="552" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#26215C">Interactive Slider / Graph</text>

<!-- Box Text -->

  <text x="340" y="570" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3C3489">Scales impact by kg amount and displays a slider and graph</text>
</svg>
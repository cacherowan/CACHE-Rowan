  <text x="340" y="198" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#04342C" style="fill:rgb(4, 52, 44);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:14px;font-weight:600;text-anchor:middle;dominant-baseline:auto">SMILES input</text>
